<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura Checker</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #12081f;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      .box {
        padding: 30px;
        max-width: 380px;
      }
      h1 {
        font-size: 2.4rem;
        margin-bottom: 8px;
      }
      p {
        color: #c9b8e8;
      }
      input {
        width: 100%;
        padding: 12px;
        font-size: 1rem;
        border-radius: 8px;
        border: none;
        box-sizing: border-box;
        margin: 12px 0;
      }
      button {
        padding: 12px 28px;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        background: #a855f7;
        color: #fff;
        cursor: pointer;
      }
      #result {
        margin-top: 24px;
        font-size: 1.3rem;
      }
      #points {
        font-size: 3rem;
        font-weight: bold;
        color: #f0abfc;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Aura Checker</h1>
      <p>Type your name and see your aura points today.</p>
      <input id="name" placeholder="Your name" />
      <button onclick="check()">Check my aura</button>
      <div id="result"></div>
    </div>

    <script>
      function check() {
        var name = document.getElementById("name").value || "Mystery person";
        var points = Math.floor(Math.random() * 20001) - 10000;
        var msg = points >= 0 ? "Big aura. W." : "Negative aura. L.";
        document.getElementById("result").innerHTML =
          name + "<br><span id='points'>" + points + "</span><br>" + msg;
      }
    </script>
  </body>
</html>
